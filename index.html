<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="page">
    <form class="card" id="profileForm" novalidate>
      <!--
        novalidate turns off the browser's built-in validation bubbles
        so we can show our own accessible, consistently styled error
        messages instead. We still keep type="email" etc. for mobile
        keyboards and semantics.
      -->

      <h1 class="card__title">Profile Settings</h1>
      <p class="card__subtitle">Update your account information below.</p>

      <!-- Full Name -->
      <div class="field">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          autocomplete="name"
          aria-describedby="fullNameError"
        >
        <!--
          aria-describedby links the input to its error message so
          screen readers announce the error when the field is focused,
          even before it's been triggered. role="alert" makes new
          error text get announced immediately once it appears.
        -->
        <p class="error-message" id="fullNameError" role="alert"></p>
      </div>

      <!-- Email -->
      <div class="field">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          inputmode="email"
          aria-describedby="emailError"
        >
        <p class="error-message" id="emailError" role="alert"></p>
      </div>

      <!-- Phone Number -->
      <div class="field">
        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          autocomplete="tel"
          inputmode="numeric"
          placeholder="e.g. 01712345678"
          aria-describedby="phoneError"
        >
        <p class="error-message" id="phoneError" role="alert"></p>
      </div>

      <!-- Password -->
      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            aria-describedby="passwordError passwordHint"
          >
          <button
            type="button"
            class="toggle-password"
            id="togglePassword"
            aria-pressed="false"
            aria-label="Show password"
          >
            Show
          </button>
        </div>
        <p class="hint" id="passwordHint">Must be at least 8 characters.</p>
        <p class="error-message" id="passwordError" role="alert"></p>
      </div>

      <!-- Submit feedback for screen readers (e.g. "Profile saved") -->
      <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>

      <button type="submit" class="submit-btn">Save Changes</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
