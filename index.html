<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile Settings</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f4f2;
    margin: 0;
    padding: 40px 20px;
  }
  .card {
    max-width: 560px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #e5e5e2;
    border-radius: 12px;
    padding: 24px 28px;
  }
  h1 {
    font-size: 18px;
    font-weight: 500;
    margin: 0 0 24px;
  }
  .section {
    border-top: 1px solid #e5e5e2;
    padding-top: 20px;
    margin-bottom: 20px;
  }
  .section:first-of-type { border-top: none; padding-top: 0; }
  .section-title {
    font-size: 13px;
    font-weight: 500;
    color: #666;
    margin: 0 0 12px;
  }
  .avatar-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 8px;
  }
  .avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #e6f1fb;
    color: #185fa5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 500;
    font-size: 20px;
    flex-shrink: 0;
  }
  .btn-secondary {
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid #ccc;
    background: #fff;
    cursor: pointer;
  }
  .btn-secondary:hover { background: #f7f7f5; }
  .hint {
    font-size: 12px;
    color: #999;
    margin: 6px 0 0;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  label {
    display: block;
    font-size: 13px;
    color: #666;
    margin-bottom: 4px;
  }
  input[type="text"],
  input[type="email"],
  input[type="password"],
  textarea {
    width: 100%;
    padding: 8px 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: inherit;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: #185fa5;
    box-shadow: 0 0 0 2px rgba(24,95,165,0.15);
  }
  textarea { resize: vertical; }
  .error-text {
    font-size: 12px;
    color: #c0392b;
    margin: 6px 0 0;
    display: none;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    font-size: 14px;
  }
  .switch {
    position: relative;
    width: 36px;
    height: 20px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #ccc;
    border-radius: 999px;
    transition: 0.2s;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    left: 2px;
    top: 2px;
    background: #fff;
    border-radius: 50%;
    transition: 0.2s;
  }
  .switch input:checked + .slider { background: #222; }
  .switch input:checked + .slider::before { transform: translateX(16px); }
  .switch input:disabled + .slider { opacity: 0.6; cursor: not-allowed; }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding-top: 8px;
  }
  .btn-primary {
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 6px;
    border: none;
    background: #1a1a1a;
    color: #fff;
    cursor: pointer;
  }
  .btn-primary:hover { background: #333; }
</style>
</head>
<body>

<form class="card" id="profileForm">
  <h1>Profile settings</h1>

  <div class="section">
    <div class="avatar-row">
      <div class="avatar" id="avatarInitials">JD</div>
      <div>
        <button type="button" class="btn-secondary">Change photo</button>
        <p class="hint">JPG or PNG, max 2 MB.</p>
      </div>
    </div>
  </div>

  <div class="section">
    <p class="section-title">Personal info</p>
    <div class="row">
      <div class="field">
        <label for="firstName">First name</label>
        <input type="text" id="firstName" value="Jamie">
      </div>
      <div class="field">
        <label for="lastName">Last name</label>
        <input type="text" id="lastName" value="Doyle">
      </div>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" value="jamie.doyle@example.com">
    </div>
    <div class="field">
      <label for="bio">Bio</label>
      <textarea id="bio" rows="3" placeholder="Tell people a bit about yourself"></textarea>
    </div>
  </div>

  <div class="section">
    <p class="section-title">Password</p>
    <div class="row" style="margin-bottom: 0;">
      <div class="field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" placeholder="••••••••">
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" placeholder="••••••••">
      </div>
    </div>
    <p class="error-text" id="passwordError">Passwords don't match.</p>
  </div>

  <div class="section">
    <p class="section-title">Notifications</p>
    <div class="toggle-row">
      <span>Product updates</span>
      <label class="switch">
        <input type="checkbox" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span>Weekly summary email</span>
      <label class="switch">
        <input type="checkbox" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span>Security alerts</span>
      <label class="switch">
        <input type="checkbox" checked disabled>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn-secondary">Cancel</button>
    <button type="submit" class="btn-primary" id="saveBtn">Save changes</button>
  </div>
</form>

<script>
  const form = document.getElementById('profileForm');
  const firstName = document.getElementById('firstName');
  const lastName = document.getElementById('lastName');
  const avatar = document.getElementById('avatarInitials');
  const newPassword = document.getElementById('newPassword');
  const confirmPassword = document.getElementById('confirmPassword');
  const passwordError = document.getElementById('passwordError');
  const saveBtn = document.getElementById('saveBtn');

  function updateAvatar() {
    const initials = (firstName.value[0] || '') + (lastName.value[0] || '');
    avatar.textContent = initials.toUpperCase() || '?';
  }
  firstName.addEventListener('input', updateAvatar);
  lastName.addEventListener('input', updateAvatar);

  function checkPasswords() {
    const mismatch = newPassword.value && confirmPassword.value &&
      newPassword.value !== confirmPassword.value;
    passwordError.style.display = mismatch ? 'block' : 'none';
    return !mismatch;
  }
  newPassword.addEventListener('input', checkPasswords);
  confirmPassword.addEventListener('input', checkPasswords);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!checkPasswords()) return;

    const data = {
      firstName: firstName.value,
      lastName: lastName.value,
      email: document.getElementById('email').value,
      bio: document.getElementById('bio').value,
      newPassword: newPassword.value,
      notifications: Array.from(document.querySelectorAll('.toggle-row input'))
        .map(el => el.checked)
    };
    console.log('Saving profile', data);

    saveBtn.textContent = 'Saved';
    setTimeout(() => { saveBtn.textContent = 'Save changes'; }, 2000);
  });
</script>

</body>
</html>
